services:
  mock-openai:
    image: bricks4agent-mock-openai:latest
    build:
      context: ../../..
      dockerfile: tools/agent/container/mock-openai.Containerfile
    environment:
      PORT: "8080"
      MOCK_MODEL: "${STACK_MODEL:-openai-proxy-dev}"
      MOCK_RESPONSE_TEXT: "${STACK_RESPONSE_TEXT:-STACK_OK}"
      EXPECTED_API_KEY: "${OPENAI_API_KEY:-dev-openai-key}"
    ports:
      - "127.0.0.1:${STACK_LLM_PORT:-8080}:8080"
    # ── OS-level hardening (design §13.2) ── non-root uid 10007 from the image
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    networks:
      - egress

  broker:
    image: bricks4agent-broker:latest
    build:
      context: ../../..
      dockerfile: packages/csharp/broker/Containerfile
    depends_on:
      - mock-openai
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      Database__Path: "/data/broker.db"
      HighLevelCoordinator__AccessRoot: "/data/workspaces"
      # ── Secrets ── no defaults; see compose.yml and tools/agent/container/README.md
      # (`node tools/agent/container/gen-stack-secrets.mjs`, then --env-file for up and down).
      Broker__ScopedToken__Secret: "${BROKER_SCOPED_TOKEN_SECRET:?run node tools/agent/container/gen-stack-secrets.mjs and pass the file with --env-file}"
      Broker__Encryption__MasterKeyBase64: "${BROKER_MASTER_KEY_BASE64:?run node tools/agent/container/gen-stack-secrets.mjs and pass the file with --env-file}"
      Broker__Encryption__EcdhPrivateKeyBase64: "${BROKER_ECDH_PRIVATE_KEY_BASE64:?run node tools/agent/container/gen-stack-secrets.mjs and pass the file with --env-file}"
      Embedding__Enabled: "false"
      RagSeed__Enabled: "false"
      LineChatGateway__RagEnabled: "false"
      LlmProxy__Enabled: "true"
      LlmProxy__Provider: "openai"
      # 預設指向 mock-openai;設 OPENAI_BASE_URL=https://api.openai.com 即可改用真實
      # 商用模型 API(ChatGPT)。搭配 OPENAI_API_KEY 真實金鑰、OPENAI_API_FORMAT
      # (responses 或 chat)與 STACK_MODEL(例如 gpt-4o-mini)。
      LlmProxy__BaseUrl: "${OPENAI_BASE_URL:-http://mock-openai:8080}"
      LlmProxy__ApiKey: "${OPENAI_API_KEY:-dev-openai-key}"
      LlmProxy__ApiFormat: "${OPENAI_API_FORMAT:-responses}"
      LlmProxy__DefaultModel: "${STACK_MODEL:-openai-proxy-dev}"
      LlmProxy__AllowModelOverride: "false"
      LlmProxy__SupportsToolCalling: "true"
      LlmProxy__StreamingEnabled: "false"
      LlmProxy__TimeoutSeconds: "60"
      DevelopmentSeed__Enabled: "true"
      DevelopmentSeed__PrincipalId: "${BROKER_PRINCIPAL_ID:-prn_openai_dev}"
      DevelopmentSeed__DisplayName: "OpenAI Compatible Development Principal"
      DevelopmentSeed__ActorType: "AI"
      DevelopmentSeed__TaskId: "${BROKER_TASK_ID:-task_openai_dev}"
      DevelopmentSeed__TaskType: "analysis"
      DevelopmentSeed__AssignedRoleId: "${BROKER_ROLE_ID:-role_reader}"
      # Registration secret for the seeded task (the broker keeps only its hash). The agent gets the
      # same value below; it is required to register a session.
      DevelopmentSeed__RegistrationSecret: "${BROKER_REGISTRATION_SECRET:?run node tools/agent/container/gen-stack-secrets.mjs and pass the file with --env-file}"
      DevelopmentSeed__RuntimeDescriptor: >-
        {"llm":{"default_model":"${STACK_MODEL:-openai-proxy-dev}","allow_model_override":false,"supports_tool_calling":true,"streaming_enabled":false},"capability_grants":[{"capability_id":"file.read","scope":{"paths":["/workspace"],"routes":["read_file"]},"quota":-1}]}
    ports:
      - "127.0.0.1:${BROKER_PORT:-5361}:5000"
    volumes:
      - broker-openai-data:/data
    # ── OS-level hardening (design §13.2) ── non-root uid 10002 from the image
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024                # .NET thread pool + sockets count as pids
    networks:
      # egress: reach mock-openai / real api.openai.com + host port-publishing
      # agent-net: internal-only link to the sealed agent
      - egress
      - agent-net

  agent:
    image: bricks4agent-agent:latest
    build:
      context: ../../..
      dockerfile: tools/agent/Containerfile
    depends_on:
      - broker
    environment:
      BROKER_URL: "http://broker:5000"
      BROKER_PUB_KEY: "${BROKER_ECDH_PUBLIC_KEY_BASE64:?run node tools/agent/container/gen-stack-secrets.mjs and pass the file with --env-file}"
      BROKER_PRINCIPAL_ID: "${BROKER_PRINCIPAL_ID:-prn_openai_dev}"
      BROKER_TASK_ID: "${BROKER_TASK_ID:-task_openai_dev}"
      BROKER_ROLE_ID: "${BROKER_ROLE_ID:-role_reader}"
      # read by agent.js from the environment only (never passed as an argument)
      BROKER_REGISTRATION_SECRET: "${BROKER_REGISTRATION_SECRET:?run node tools/agent/container/gen-stack-secrets.mjs and pass the file with --env-file}"
      BROKER_WAIT_FOR_HEALTH: "1"
      BROKER_WAIT_TIMEOUT_SECONDS: "90"
      AGENT_PROJECT_ROOT: "/workspace"
      AGENT_MODEL: "${STACK_MODEL:-openai-proxy-dev}"
      AGENT_MAX_ITERATIONS: "4"
      AGENT_NO_CONFIRM: "1"
      AGENT_VERBOSE: "${AGENT_VERBOSE:-0}"
      AGENT_RUN: "${AGENT_RUN:-Reply with the exact text STACK_OK.}"
    # No volumes: the repository is NOT mounted into the agent (§13.4); /workspace is
    # an empty logical root baked into the image and the manual is /app/AGENT.md.
    restart: "no"
    # ── OS-level hardening (design §13) — see compose.yml for rationale ──
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    networks:
      # internal-only: agent reaches the broker and nothing else (§13.1).
      # The broker holds the OpenAI key and is the only egress to the provider.
      - agent-net

# ── Network Isolation (design §13.1) ──
# agent-net: internal:true — the agent has no route to the host/internet and can
#   reach only the broker. The commercial API still works because the BROKER (on
#   egress) makes the OpenAI call; the agent never holds a key or egresses itself.
# egress:    bridge — broker + mock-openai reach the provider and publish ports.
networks:
  agent-net:
    name: bricks4agent_openai_agent-net
    driver: bridge
    internal: true
  egress:
    name: bricks4agent_openai_egress
    driver: bridge

volumes:
  broker-openai-data:
